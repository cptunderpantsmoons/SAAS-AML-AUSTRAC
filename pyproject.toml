[project]
name = "document-detection-engine"
version = "0.1.0"
description = "Sprint 1 document detection engine for AML/CTF SaaS platform."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["document_detection_engine", "orchestration_layer", "ubo_graph", "transaction_monitoring", "austrac_reporting", "compliance_agent", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["agentmail", "agentmail.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pydantic_ai", "pydantic_ai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true
