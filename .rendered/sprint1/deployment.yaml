apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-detection-engine
  namespace: aml-platform
  labels:
    app: document-detection-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-detection-engine
  template:
    metadata:
      labels:
        app: document-detection-engine
    spec:
      serviceAccountName: document-detection-engine
      containers:
        - name: document-detection-engine
          image: 123456789012.dkr.ecr.ap-southeast-2.amazonaws.com/aml-platform/document-detection-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: document-detection-engine-config
          env:
            - name: KMS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: document-detection-engine-secrets
                  key: kms_key_id
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
