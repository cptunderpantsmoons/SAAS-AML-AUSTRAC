version: "3.8"

services:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/cptunderpantsmoons/aml-austrac-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://srv1603169.hstgr.cloud:8000
      - NEXT_PUBLIC_SUPERTOKENS_CORE_URL=https://srv1603169.hstgr.cloud
      - NEXT_PUBLIC_APP_NAME=AML AUSTRAC
      - NEXT_PUBLIC_WEBSITE_DOMAIN=http://srv1603169.hstgr.cloud:3000
    networks:
      - aml-network

  # ── Main API gateway ──────────────────────────────────────────────────────
  api:
    image: ghcr.io/cptunderpantsmoons/aml-austrac-backend:latest
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SUPERTOKENS_CONNECTION_URI=https://srv1603169.hstgr.cloud
      - SUPERTOKENS_API_DOMAIN=http://srv1603169.hstgr.cloud:8000
      - SUPERTOKENS_WEBSITE_DOMAIN=http://srv1603169.hstgr.cloud:3000
      - CORS_ALLOWED_ORIGINS=http://srv1603169.hstgr.cloud:3000
      - TX_MONITORING_URL=http://transaction-monitoring:8000
      - REPORTING_URL=http://austrac-reporting:8000
      - GOVERNANCE_URL=http://governance:8000
      - DOCUMENT_ENGINE_URL=http://document-engine:8000
      - UBO_GRAPH_URL=http://ubo-graph:8000
      - COMPLIANCE_AGENT_URL=http://compliance-agent:8006
    depends_on:
      - transaction-monitoring
      - austrac-reporting
      - governance
      - compliance-agent
      - document-engine
      - ubo-graph
    networks:
      - aml-network
    command: ["uvicorn", "orchestration_layer.app:app", "--host", "0.0.0.0", "--port", "8000"]

  # ── Transaction Monitoring ────────────────────────────────────────────────
  transaction-monitoring:
    image: ghcr.io/cptunderpantsmoons/aml-austrac-backend:latest
    environment:
      - PORT=8000
    networks:
      - aml-network
    command: ["uvicorn", "transaction_monitoring.app:app", "--host", "0.0.0.0", "--port", "8000"]

  # ── AUSTRAC Reporting ─────────────────────────────────────────────────────
  austrac-reporting:
    image: ghcr.io/cptunderpantsmoons/aml-austrac-backend:latest
    environment:
      - PORT=8000
    networks:
      - aml-network
    command: ["uvicorn", "austrac_reporting.app:app", "--host", "0.0.0.0", "--port", "8000"]

  # ── Governance ────────────────────────────────────────────────────────────
  governance:
    image: ghcr.io/cptunderpantsmoons/aml-austrac-backend:latest
    environment:
      - PORT=8000
      - SUPERTOKENS_CONNECTION_URI=https://srv1603169.hstgr.cloud
      - SUPERTOKENS_API_DOMAIN=http://srv1603169.hstgr.cloud:8000
      - SUPERTOKENS_WEBSITE_DOMAIN=http://srv1603169.hstgr.cloud:3000
    networks:
      - aml-network
    command: ["uvicorn", "governance.app:app", "--host", "0.0.0.0", "--port", "8000"]

  # ── Compliance Agent ────────────────────────────────────────────────────────
  compliance-agent:
    image: ghcr.io/cptunderpantsmoons/aml-austrac-backend:latest
    environment:
      - PORT=8006
      - GATEWAY_URL=http://api:8000
      - SUPERTOKENS_CONNECTION_URI=https://srv1603169.hstgr.cloud
      - SUPERTOKENS_API_DOMAIN=http://srv1603169.hstgr.cloud:8006
      - SUPERTOKENS_WEBSITE_DOMAIN=http://srv1603169.hstgr.cloud:3000
    networks:
      - aml-network
    command: ["uvicorn", "compliance_agent.app:app", "--host", "0.0.0.0", "--port", "8006"]

  # ── Document Detection Engine ─────────────────────────────────────────────
  document-engine:
    image: ghcr.io/cptunderpantsmoons/aml-austrac-backend:latest
    environment:
      - PORT=8000
    networks:
      - aml-network
    command: ["uvicorn", "document_detection_engine.app:app", "--host", "0.0.0.0", "--port", "8000"]

  # ── UBO Graph ────────────────────────────────────────────────────────────
  ubo-graph:
    image: ghcr.io/cptunderpantsmoons/aml-austrac-backend:latest
    environment:
      - PORT=8000
    networks:
      - aml-network
    command: ["uvicorn", "ubo_graph.app:app", "--host", "0.0.0.0", "--port", "8000"]

networks:
  aml-network:
    driver: bridge
