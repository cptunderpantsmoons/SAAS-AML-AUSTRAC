apiVersion: v1
kind: ConfigMap
metadata:
  name: ubo-graph-service-config
  namespace: aml-platform
data:
  AWS_REGION: ap-southeast-2
  UBO_SERVICE_PORT: "8002"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_DATABASE: "neo4j"
  REDIS_URL: "rediss://ubo-redis.aml-platform.svc.cluster.local:6379/0"
  DEFAULT_THRESHOLD_PERCENTAGE: "25.0"
  DEFAULT_MAX_DEPTH: "5"
