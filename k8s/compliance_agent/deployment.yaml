apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-agent
  namespace: aml-platform
  labels:
    app: compliance-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compliance-agent
  template:
    metadata:
      labels:
        app: compliance-agent
    spec:
      serviceAccountName: compliance-agent
      containers:
        - name: compliance-agent
          image: 123456789012.dkr.ecr.ap-southeast-2.amazonaws.com/compliance-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8006
              name: http
          envFrom:
            - configMapRef:
                name: compliance-agent-config
          env:
            - name: AGENTMAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compliance-agent-secrets
                  key: AGENTMAIL_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
